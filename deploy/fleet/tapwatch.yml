apiVersion: v1
kind: report
spec:
  name: file_changes
  description: 'R39: a write to a persistence or privilege file (ld.so.preload, sudoers, sudoers.d, profile.d, the shells''
    start-up files, XDG autostart) as it happens, from inotify. file_paths watches the directories, not the files: a file
    that doesn''t exist yet (ld.so.preload normally doesn''t) is never watched, and a save-by-rename (sed -i, visudo, editors)
    drops a file''s watch; the WHERE picks the files (measured with osqueryd 5.23.1). sed''s and editors'' temporary names
    are left out. The home part of the path is reduced to ~ here, so no user name reaches the log. inotify sees Linux paths
    only (not /mnt/c under WSL).'
  query: SELECT time, action, category, COALESCE('~/' || regex_match(target_path, '^/(?:home/[^/]+|root)/(.*)$', 1), target_path)
    AS file FROM file_events WHERE action IN ('CREATED', 'UPDATED', 'MOVED_TO', 'ATTRIBUTES_MODIFIED') AND (target_path IN
    ('/etc/ld.so.preload', '/etc/sudoers') OR (target_path LIKE '/etc/sudoers.d/%' OR target_path LIKE '/etc/profile.d/%'
    OR target_path LIKE '%/.config/autostart/%' OR regex_match(target_path, '^/(?:home/[^/]+|root)/\.(?:bashrc|bash_profile|profile|zshrc|bash_logout)$',
    0) IS NOT NULL) AND regex_match(target_path, '/(?:sed[A-Za-z0-9]{6}|[^/]*\.tmp|[^/]*~|\.[^/]*\.swp)$', 0) IS NULL);
  interval: 60
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: sysmon_events
  description: 'Sysmon, as it happens: files created in a Startup folder (11, R39: only the file name and per-user or all-users,
    never the path, which holds the user name; Image is the program that wrote it), process starts with parent and the original
    file name from the version resource (1, R36 matches a renamed remote-access tool by it; R37/R38 signals cmd_tunnel, cmd_sync
    with only its destination in sync_dest, cmd_archive_pw with the user folder in archive_of, their command lines never kept),
    outgoing connections (3), DNS lookups (22), and other programs opening lsass.exe (10: source, target, access mask; sysmon.xml
    filters Windows'' own), each with the program behind it. Command lines become yes/no signals here (cmd_enc encoded payload,
    cmd_b64, cmd_dl download-and-run, cmd_iex, cmd_hidden, cmd_bypass, cmd_url, cmd_dllpath (rundll32/regsvr32 naming a DLL
    in a user folder, ProgramData, Windows\\Temp, a share, or javascript:), and for R24 cmd_shadow backups removed, cmd_recovery,
    cmd_logclear, cmd_defender, cmd_admin); the raw text is logged only when one of enc/b64/dl/iex or an R24 signal fires
    (the same five patterns, kept in step by tests/test_hostrules.py), because osquery''s log is readable by every local account.
    Needs the Windows event publisher flags (config/windows.flags).'
  query: SELECT eventid, json_extract(data, '$.EventData.UtcTime') AS utc, json_extract(data, '$.EventData.ProcessGuid') AS
    guid, json_extract(data, '$.EventData.ParentProcessGuid') AS parent_guid, json_extract(data, '$.EventData.Image') AS path,
    json_extract(data, '$.EventData.OriginalFileName') AS original_name, CASE WHEN eventid = 11 THEN regex_match(json_extract(data,
    '$.EventData.TargetFilename'), '[^\\]+$', 0) END AS file_name, CASE WHEN eventid = 11 THEN (CASE WHEN lower(json_extract(data,
    '$.EventData.TargetFilename')) LIKE '%\programdata\microsoft\windows\start menu\%' THEN 'all users' ELSE 'per user' END)
    END AS startup_scope, CASE WHEN eventid = 1 AND (CASE WHEN (lower(json_extract(data, '$.EventData.CommandLine')) LIKE
    '%ngrok%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%cloudflared%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%tunnel%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%funnel%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%ssh%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE 'lt %' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%/lt %' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%\lt %' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%/lt"%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%\lt"%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%lt.cmd%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%lt.js%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%bore%') THEN ((regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])ngrok(?:\.exe|\.cmd)?"?\s+(?:http|tcp|tls|start|tunnel)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])cloudflared(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?tunnel(?:\s+(?!\s)(?!(?:list|info|delete|cleanup|route|token|login|create|vnet|ingress|diag)\b)|\s*$)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])code(?:-insiders)?(?:\.exe|\.cmd)?"?\s+tunnel(?:\s+(?!\s)(?!status|kill|prune|unregister|user|rename|restart)|$)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])code-tunnel(?:\.exe|\.cmd)?"?(?:\s|$)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])devtunnel(?:\.exe|\.cmd)?"?\s+host\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])tailscale(?:\.exe|\.cmd)?"?\s+funnel\s+(?!\s)(?!status|reset|--help|-h\b)(?![^|]*\soff\b)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])ssh(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?-[a-z]*r\s*[0-9]',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])lt(?:\.js)?(?:\.exe|\.cmd)?"?\s+(?:--port|-p)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])bore(?:\.exe|\.cmd)?"?\s+local\b',
    0) IS NOT NULL)) ELSE 0 END) THEN 1 ELSE 0 END AS cmd_tunnel, CASE WHEN eventid = 1 AND (CASE WHEN (lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%rclone%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%restic%' OR
    lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%aws%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%gsutil%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%gcloud%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%azcopy%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%storage blob%' OR lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%mega%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%winscp%') THEN
    ((regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])rclone(?:\.exe|\.cmd)?"?\s+(?:copy|copyto|sync|move|moveto|bisync)\s+[^|]*?\s\"?([a-z0-9_-]{2,}):[^\s\"]*\"?(?:\s+--(?:config|log-file|[a-z]+-from|password-command)[\s=]\S+|\s+-\S+(?:\s+[^\s/\\:-][^\s:]*)?)*\s*$',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])restic(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?backup\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])aws(?:\.exe|\.cmd)?"?\s+s3\s+(?:cp|sync|mv)\s+(?:-\S+\s+)*(?!\"?s3://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?s3://',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:gsutil|gcloud(?:\s+storage)?)(?:\.exe|\.cmd)?"?\s+(?:-\S+\s+)*(?:cp|rsync|mv)\s+(?:-\S+\s+)*(?!\"?gs://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?gs://',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])azcopy(?:\.exe|\.cmd)?"?\s+(?:copy|cp|sync)\s[^|]*\.blob\.core\.windows\.net',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])az(?:\.exe|\.cmd)?"?\s+storage\s+blob\s+(?:upload|upload-batch|sync)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:mega-put|mega-sync|megaput)\b|(?:^|[\\/"])megatools\s+(?:put|copy)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])winscp(?:\.com|\.exe)?\"?\s[^|]*\bput\b',
    0) IS NOT NULL)) ELSE 0 END) THEN 1 ELSE 0 END AS cmd_sync, CASE WHEN eventid = 1 AND (CASE WHEN (lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%7z%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%rar%' OR lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%zip%') THEN ((regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])7z[a-z]?(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-p',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:win)?rar(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-(?:hp|p)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])zip\s+(?:[^|]*\s)?(?:-e\b|-p\s|--encrypt|--password)',
    0) IS NOT NULL)) ELSE 0 END) THEN 1 ELSE 0 END AS cmd_archive_pw, CASE WHEN eventid = 1 AND (CASE WHEN (lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%rclone%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%restic%' OR
    lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%aws%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%gsutil%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%gcloud%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%azcopy%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%storage blob%' OR lower(json_extract(data,
    '$.EventData.CommandLine')) LIKE '%mega%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%winscp%') THEN
    ((regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])rclone(?:\.exe|\.cmd)?"?\s+(?:copy|copyto|sync|move|moveto|bisync)\s+[^|]*?\s\"?([a-z0-9_-]{2,}):[^\s\"]*\"?(?:\s+--(?:config|log-file|[a-z]+-from|password-command)[\s=]\S+|\s+-\S+(?:\s+[^\s/\\:-][^\s:]*)?)*\s*$',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])restic(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?backup\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])aws(?:\.exe|\.cmd)?"?\s+s3\s+(?:cp|sync|mv)\s+(?:-\S+\s+)*(?!\"?s3://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?s3://',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:gsutil|gcloud(?:\s+storage)?)(?:\.exe|\.cmd)?"?\s+(?:-\S+\s+)*(?:cp|rsync|mv)\s+(?:-\S+\s+)*(?!\"?gs://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?gs://',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])azcopy(?:\.exe|\.cmd)?"?\s+(?:copy|cp|sync)\s[^|]*\.blob\.core\.windows\.net',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])az(?:\.exe|\.cmd)?"?\s+storage\s+blob\s+(?:upload|upload-batch|sync)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:mega-put|mega-sync|megaput)\b|(?:^|[\\/"])megatools\s+(?:put|copy)\b',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])winscp(?:\.com|\.exe)?\"?\s[^|]*\bput\b',
    0) IS NOT NULL)) ELSE 0 END) THEN COALESCE(regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])rclone(?:\.exe|\.cmd)?"?\s+(?:copy|copyto|sync|move|moveto|bisync)\s+[^|]*?\s\"?([a-z0-9_-]{2,}):[^\s\"]*\"?(?:\s+--(?:config|log-file|[a-z]+-from|password-command)[\s=]\S+|\s+-\S+(?:\s+[^\s/\\:-][^\s:]*)?)*\s*$',
    1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])restic(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?(?:-r|--repo)[\s=]+\"?(?:s3|b2|azure|gs|sftp|rest|rclone|swift):/*(?:https?://)?(?:[^\s\"]*@)?(?!https?:)([^\s/\\:\"@]+)(?=/|:[0-9/]|\s|\"|$)',
    1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\bs3://([a-z0-9._-]+)', 1), regex_match(lower(json_extract(data,
    '$.EventData.CommandLine')), '\bgs://([a-z0-9._-]+)', 1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')),
    'https://([a-z0-9]+)\.blob\.core\.windows\.net', 1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')),
    '--account-name[\s=]+\"?([a-z0-9]+)', 1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(mega)-(?:put|sync)\b',
    1), regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\bopen\s+\"?[a-z]+://(?:[^\s\"]*@)?([^/\s:\"@]+)(?=/|:[0-9/]|\s|\"|$)',
    1)) END AS sync_dest, CASE WHEN eventid = 1 AND (CASE WHEN (lower(json_extract(data, '$.EventData.CommandLine')) LIKE
    '%7z%' OR lower(json_extract(data, '$.EventData.CommandLine')) LIKE '%rar%' OR lower(json_extract(data, '$.EventData.CommandLine'))
    LIKE '%zip%') THEN ((regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])7z[a-z]?(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-p',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])(?:win)?rar(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-(?:hp|p)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(?:^|[\\/"])zip\s+(?:[^|]*\s)?(?:-e\b|-p\s|--encrypt|--password)',
    0) IS NOT NULL)) ELSE 0 END) THEN regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '[\\/](documents|desktop|pictures|onedrive)\b',
    1) END AS archive_of, CASE WHEN (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\s-e[a-z]*\s+[a-z0-9+/=]{20,}',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL)
    OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression',
    0) IS NOT NULL)  OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'vssadmin(\.exe)?\"?[^|]*(delete[^|]*shadows|resize\s+shadowstorage)|wbadmin(\.exe)?\"?[^|]*delete[^|]*(catalog|systemstatebackup)|shadowcopy[^|]*delete|win32_shadowcopy',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'bcdedit(\.exe)?\"?[^|]*(recoveryenabled\s+no|bootstatuspolicy\s+ignoreallfailures)',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'wevtutil(\.exe)?\"?\s+(cl|clear-log)\s|clear-eventlog|limit-eventlog',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'set-mppreference[^|]*-disable|add-mppreference[^|]*-exclusion|mpcmdrun(\.exe)?\"?[^|]*-removedefinitions|sc(\.exe)?\"?\s+(stop|config)\s+windefend',
    0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'net1?(\.exe)?\"?\s+user\s[^|]*\s/add|net1?(\.exe)?\"?\s+localgroup\s+administrators\s[^|]*\s/add|add-localgroupmember|new-localuser',
    0) IS NOT NULL) THEN json_extract(data, '$.EventData.CommandLine') END AS cmdline, (regex_match(lower(json_extract(data,
    '$.EventData.CommandLine')), '\s-e[a-z]*\s+[a-z0-9+/=]{20,}', 0) IS NOT NULL) AS cmd_enc, (regex_match(lower(json_extract(data,
    '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL) AS cmd_b64, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')),
    'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache', 0) IS NOT NULL) AS cmd_dl,
    (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression', 0) IS
    NOT NULL) AS cmd_iex, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\s-w[a-z]*\s+h[a-z]*', 0) IS
    NOT NULL) AS cmd_hidden, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\s-(ep|ex[a-z]*)\s+bypass',
    0) IS NOT NULL) AS cmd_bypass, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'https?://', 0) IS NOT
    NULL) AS cmd_url, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(rundll32|regsvr32)(\.exe)?"?\s+[^|]*(\\users\\|\\programdata\\|\\windows\\temp\\|javascript:|vbscript:|\\\\[a-z0-9])',
    0) IS NOT NULL) AS cmd_dllpath, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'vssadmin(\.exe)?\"?[^|]*(delete[^|]*shadows|resize\s+shadowstorage)|wbadmin(\.exe)?\"?[^|]*delete[^|]*(catalog|systemstatebackup)|shadowcopy[^|]*delete|win32_shadowcopy',
    0) IS NOT NULL) AS cmd_shadow, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'bcdedit(\.exe)?\"?[^|]*(recoveryenabled\s+no|bootstatuspolicy\s+ignoreallfailures)',
    0) IS NOT NULL) AS cmd_recovery, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'wevtutil(\.exe)?\"?\s+(cl|clear-log)\s|clear-eventlog|limit-eventlog',
    0) IS NOT NULL) AS cmd_logclear, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'set-mppreference[^|]*-disable|add-mppreference[^|]*-exclusion|mpcmdrun(\.exe)?\"?[^|]*-removedefinitions|sc(\.exe)?\"?\s+(stop|config)\s+windefend',
    0) IS NOT NULL) AS cmd_defender, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'net1?(\.exe)?\"?\s+user\s[^|]*\s/add|net1?(\.exe)?\"?\s+localgroup\s+administrators\s[^|]*\s/add|add-localgroupmember|new-localuser',
    0) IS NOT NULL) AS cmd_admin, json_extract(data, '$.EventData.ParentImage') AS parent_path, json_extract(data, '$.EventData.DestinationIp')
    AS remote_address, json_extract(data, '$.EventData.DestinationPort') AS remote_port, json_extract(data, '$.EventData.QueryName')
    AS query, json_extract(data, '$.EventData.SourceImage') AS source_path, json_extract(data, '$.EventData.SourceProcessGUID')
    AS source_guid, json_extract(data, '$.EventData.TargetImage') AS target_path, json_extract(data, '$.EventData.GrantedAccess')
    AS granted FROM windows_events WHERE source = 'Microsoft-Windows-Sysmon/Operational' AND (eventid IN (1, 10, 22) OR (eventid
    = 11 AND lower(json_extract(data, '$.EventData.TargetFilename')) LIKE '%\start menu\programs\startup\%') OR (eventid =
    3 AND json_extract(data, '$.EventData.Initiated') = 'true'));
  interval: 60
  platform: windows
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
