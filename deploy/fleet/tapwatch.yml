# Generated by tools/fleet_config.py from agents/config/osquery.conf; don't edit by hand.
# Apply with: fleetctl apply -f deploy/fleet/tapwatch.yml
apiVersion: v1
kind: config
spec:
  agent_options:
    config:
      options:
        disable_distributed: false
        distributed_interval: 10
        distributed_plugin: tls
        distributed_tls_max_attempts: 3
        logger_tls_endpoint: /api/osquery/log
        logger_tls_period: 10
        pack_delimiter: /
        schedule_splay_percent: 10
      decorators:
        load:
        - SELECT uuid AS host_uuid FROM system_info;
        - SELECT hostname AS hostname FROM system_info;
      file_paths:
        tapwatch_system:
        - /etc/
        - /etc/sudoers.d/
        - /etc/profile.d/
        tapwatch_shell:
        - /home/%/
        - /root/
        - /home/%/.config/autostart/
        - /root/.config/autostart/
    overrides: {}
---
apiVersion: v1
kind: report
spec:
  name: system_info
  description: What this machine is.
  query: SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;
  interval: 86400
  platform: ''
  logging: snapshot
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: os_version
  description: ''
  query: SELECT name, version, build, platform, arch FROM os_version;
  interval: 86400
  platform: ''
  logging: snapshot
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: host_addresses
  description: This machine's own addresses. DHCP moves a PC to a new IP; tapwatch follows these instead of trusting the IP
    in its config, so host context and the rules that name the PC keep working.
  query: SELECT address FROM interface_addresses WHERE address NOT LIKE '127.%' AND address NOT LIKE '169.254.%' AND address
    != '::1' AND address NOT LIKE 'fe80:%';
  interval: 300
  platform: ''
  logging: snapshot
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: listening_ports
  description: Services reachable from the network. New rows mean something started listening.
  query: SELECT p.name, p.path, l.port, l.protocol, l.address FROM listening_ports l JOIN processes p USING (pid) WHERE l.address
    NOT IN ('127.0.0.1', '::1') AND l.port != 0;
  interval: 3600
  platform: ''
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: outbound_connections
  description: 'Which process holds which outside connection (Windows; a 1-minute snapshot, Sysmon has the full history),
    with its parent. Code signatures come from process_signatures: checked per socket here they took 15 s (measured 2026-10-17,
    57 sockets), osquery''s watchdog killed the worker and denylisted this query by name for 24 h, twice. Command lines are
    not logged here; the live check reads them and redacts them.'
  query: SELECT p.name, p.path, p.pid, p.on_disk, s.remote_address, s.remote_port, s.protocol, (SELECT name FROM processes
    pp WHERE pp.pid = p.parent) AS parent_name FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address
    NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;
  interval: 60
  platform: windows
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: process_signatures
  description: 'The code signature (authenticode) of every program that currently holds an outside connection, once per distinct
    path (Windows; a 5-minute snapshot). tapwatch joins it to outbound_connections by path: the bad-signature rule (R21) and
    the host context''s program judgement read it. Measured 2026-10-17: 5.8 s for 11 paths, against 15 s when checked per
    socket.'
  query: SELECT path, result AS signature, subject_name AS signer FROM authenticode WHERE path IN (SELECT DISTINCT p.path
    FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1',
    '::1') AND s.remote_port != 0 AND p.path != '');
  interval: 300
  platform: windows
  logging: snapshot
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: outbound_connections_ctx
  description: Which process holds which outside connection, and whether a Claude Code session started it (attended or not,
    from an SSH login or the owner's Herdr terminal). Environment markers survive reparenting, unlike the parent chain. Reads
    only these named variables, never secrets. tapwatch's host context reads these rows. Also the parent program and whether
    the program's file was deleted after it started, and its cgroup (container processes look deleted from the host). Command
    lines are deliberately not logged here (they can carry tokens and this log is world-readable); tapwatch's live check reads
    them as the user and redacts them in memory.
  query: SELECT p.pid, p.name, p.path, p.on_disk, p.cgroup_path, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS
    parent_name, s.remote_address, s.remote_port, s.protocol, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key
    = 'CLAUDE_CODE_SESSION_ID') AS claude_session, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED')
    AS claude_attended, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT') AS claude_entrypoint,
    (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM
    process_envs e WHERE e.pid = p.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM process_open_sockets
    s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port
    != 0;
  interval: 60
  platform: darwin,linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: bpf_connections
  description: 'Linux (and WSL): every outgoing connection as it happens, from osquery''s eBPF publisher (config/linux.flags),
    with the program, its parent and whether a Claude Code session, Herdr pane or SSH login started it (markers read from
    the process or its parent while they still run). The Linux counterpart of Sysmon''s connection events: short HTTPS calls
    between the 1-minute snapshots no longer go unseen. Reads only the named environment variables. 10.255.255.254 is WSL''s
    DNS proxy. Never denylisted ("denylist": false): a feed the rules read, and osquery skips a query for a day when a restart
    (any agent deploy) or the watchdog catches it mid-run. The cost: a query that really hangs would restart the worker again
    and again; R22 reports a silent feed. Process lookups are one pid at a time (pid = x, never pid IN (...)): a correlated
    IN list reads every process''s environment.'
  query: SELECT b.time, b.pid, b.parent, b.path, b.remote_address, b.remote_port, b.protocol, (SELECT name FROM processes
    pp WHERE pp.pid = b.parent) AS parent_name, (SELECT cgroup_path FROM processes p WHERE p.pid = b.pid) AS cgroup_path,
    COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ID'), (SELECT value FROM
    process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ID')) AS claude_session, COALESCE((SELECT value
    FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED'), (SELECT value FROM process_envs e
    WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED')) AS claude_attended, COALESCE((SELECT value FROM process_envs
    e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT'), (SELECT value FROM process_envs e WHERE e.pid = b.parent
    AND e.key = 'CLAUDE_CODE_ENTRYPOINT')) AS claude_entrypoint, ((SELECT count(*) FROM process_envs e WHERE e.pid = b.pid
    AND e.key = 'HERDR_PANE_ID') + (SELECT count(*) FROM process_envs e WHERE e.pid = b.parent AND e.key = 'HERDR_PANE_ID'))
    AS in_herdr, ((SELECT count(*) FROM process_envs e WHERE e.pid = b.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT'))
    + (SELECT count(*) FROM process_envs e WHERE e.pid = b.parent AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT'))) AS via_ssh
    FROM bpf_socket_events b WHERE b.syscall = 'connect' AND b.family IN (2, 10) AND b.remote_address NOT IN ('', '0.0.0.0',
    '::', '127.0.0.1', '::1', '10.255.255.254') AND b.remote_port != 0;
  interval: 60
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: bpf_process_events
  description: 'Linux (and WSL): every program start as it happens (eBPF exec events): pid, parent pid and program, plus the
    R28 signals computed here from the command line: lcmd_dlrun (download piped into a shell), lcmd_revshell, lcmd_b64exec,
    lcmd_histclear, lcmd_tmpexec, lcmd_miner (a cryptominer). R37/R38 add lcmd_tunnel (ngrok, cloudflared tunnel, code tunnel,
    ssh -R ...), lcmd_sync (rclone, restic, cloud CLIs) with only its destination in sync_dest, and lcmd_archive_pw with the
    user folder it packs in archive_of; for these the command line is never kept (tokens, archive passwords, user:pass repositories),
    and when a tunnel or sync fires the Claude Code markers of that process or its parent are read (claude_session, claude_attended).
    Otherwise the command line itself is kept only when one fires; it can hold a token (curl -H ''Authorization: ...'' | sh)
    and this log is readable by every local account, the same trade-off as the Windows Sysmon query. Not the working directory:
    home paths and project folder names would land in the same log. Never denylisted ("denylist": false): a feed the rules
    read, and osquery skips a query for a day when a restart (any agent deploy) or the watchdog catches it mid-run. The cost:
    a query that really hangs would restart the worker again and again; R22 reports a silent feed. Process lookups are one
    pid at a time (pid = x, never pid IN (...)): a correlated IN list reads every process''s environment.'
  query: SELECT time, pid, parent, path, lcmd_dlrun, lcmd_revshell, lcmd_b64exec, lcmd_histclear, lcmd_tmpexec, lcmd_miner,
    CASE WHEN lcmd_dlrun OR lcmd_revshell OR lcmd_b64exec OR lcmd_histclear OR lcmd_tmpexec OR lcmd_miner THEN cmdline END
    AS cmdline, lcmd_tunnel, lcmd_sync, lcmd_archive_pw, CASE WHEN lcmd_sync THEN COALESCE(regex_match(lower(cmdline), '(?:^|[\\/"])rclone(?:\.exe|\.cmd)?"?\s+(?:copy|copyto|sync|move|moveto|bisync)\s+[^|]*?\s\"?([a-z0-9_-]{2,}):[^\s\"]*\"?(?:\s+--(?:config|log-file|[a-z]+-from|password-command)[\s=]\S+|\s+-\S+(?:\s+[^\s/\\:-][^\s:]*)?)*\s*$',
    1), regex_match(lower(cmdline), '(?:^|[\\/"])restic(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?(?:-r|--repo)[\s=]+\"?(?:s3|b2|azure|gs|sftp|rest|rclone|swift):/*(?:https?://)?(?:[^\s\"]*@)?(?!https?:)([^\s/\\:\"@]+)(?=/|:[0-9/]|\s|\"|$)',
    1), regex_match(lower(cmdline), '\bs3://([a-z0-9._-]+)', 1), regex_match(lower(cmdline), '\bgs://([a-z0-9._-]+)', 1),
    regex_match(lower(cmdline), 'https://([a-z0-9]+)\.blob\.core\.windows\.net', 1), regex_match(lower(cmdline), '--account-name[\s=]+\"?([a-z0-9]+)',
    1), regex_match(lower(cmdline), '(?:^|[\\/"])(mega)-(?:put|sync)\b', 1), regex_match(lower(cmdline), '\bopen\s+\"?[a-z]+://(?:[^\s\"]*@)?([^/\s:\"@]+)(?=/|:[0-9/]|\s|\"|$)',
    1)) END AS sync_dest, CASE WHEN lcmd_archive_pw THEN regex_match(lower(cmdline), '[\\/](documents|desktop|pictures|onedrive)\b',
    1) END AS archive_of, CASE WHEN lcmd_tunnel OR lcmd_sync THEN COALESCE((SELECT value FROM process_envs e WHERE e.pid =
    x.pid AND e.key = 'CLAUDE_CODE_SESSION_ID'), (SELECT value FROM process_envs e WHERE e.pid = x.parent AND e.key = 'CLAUDE_CODE_SESSION_ID'))
    END AS claude_session, CASE WHEN lcmd_tunnel OR lcmd_sync THEN COALESCE((SELECT value FROM process_envs e WHERE e.pid
    = x.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED'), (SELECT value FROM process_envs e WHERE e.pid = x.parent AND e.key
    = 'CLAUDE_CODE_SESSION_ATTENDED')) END AS claude_attended, CASE WHEN lcmd_tunnel OR lcmd_sync THEN (SELECT count(*) FROM
    process_envs e WHERE e.pid = x.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) + (SELECT count(*) FROM process_envs
    e WHERE e.pid = x.parent AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) END AS via_ssh FROM (SELECT time, pid, parent,
    path, cmdline, (regex_match(lower(cmdline), '(curl|wget)[^|;]*\|\s*(sudo(\s+-\S+)*\s+)?(env\s+)?(\S*/)?(ba|z|da)?sh\b|(ba|z|da)?sh\s+(-c\s+\S?\$\(|<\()\s*(curl|wget)\b',
    0) IS NOT NULL) AS lcmd_dlrun, (regex_match(lower(cmdline), '/dev/(tcp|udp)/(?!(127\.|localhost))|\bnc(at)?(\.openbsd|\.traditional)?\s+([^|;&]*\s)?-[a-z]*e\b|socat\s[^|]*exec:|bash\s+-i\s*[>&]|mkfifo\s[^|]*\|\s*[^|]*\bnc\b|python[0-9.]*\s+-c\s[^|]*socket[^|]*(subprocess|pty|dup2)|perl\s+-e\s[^|]*socket',
    0) IS NOT NULL) AS lcmd_revshell, (regex_match(lower(cmdline), 'base64\s+(-d|--decode)[^|]*\|\s*(sudo\s+)?(ba|z|da)?sh\b',
    0) IS NOT NULL) AS lcmd_b64exec, (regex_match(lower(cmdline), 'unset\s+histfile|history\s+-c|histfile=/dev/null|ln\s+-sf?\s+/dev/null\s+[^|]*bash_history|histsize=0\b',
    0) IS NOT NULL) AS lcmd_histclear, (regex_match(lower(cmdline), 'chmod\s+(-[a-z]+\s+)*([ugoa]*\+[rwxst]*x|[0-7]*[1357][0-7]*)\s+[^|;]*/(tmp|dev/shm|var/tmp)/',
    0) IS NOT NULL) AS lcmd_tmpexec, (regex_match(lower(cmdline), 'stratum\+(tcp|ssl|tls)://|^\S*xmrig\b|--donate-level|--coin[=
    ]+(monero|xmr)', 0) IS NOT NULL) AS lcmd_miner, (CASE WHEN (lower(cmdline) LIKE '%ngrok%' OR lower(cmdline) LIKE '%cloudflared%'
    OR lower(cmdline) LIKE '%tunnel%' OR lower(cmdline) LIKE '%funnel%' OR lower(cmdline) LIKE '%ssh%' OR lower(cmdline) LIKE
    'lt %' OR lower(cmdline) LIKE '%/lt %' OR lower(cmdline) LIKE '%\lt %' OR lower(cmdline) LIKE '%/lt"%' OR lower(cmdline)
    LIKE '%\lt"%' OR lower(cmdline) LIKE '%lt.cmd%' OR lower(cmdline) LIKE '%lt.js%' OR lower(cmdline) LIKE '%bore%') THEN
    ((regex_match(lower(cmdline), '(?:^|[\\/"])ngrok(?:\.exe|\.cmd)?"?\s+(?:http|tcp|tls|start|tunnel)\b', 0) IS NOT NULL)
    OR (regex_match(lower(cmdline), '(?:^|[\\/"])cloudflared(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?tunnel(?:\s+(?!\s)(?!(?:list|info|delete|cleanup|route|token|login|create|vnet|ingress|diag)\b)|\s*$)',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])code(?:-insiders)?(?:\.exe|\.cmd)?"?\s+tunnel(?:\s+(?!\s)(?!status|kill|prune|unregister|user|rename|restart)|$)',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])code-tunnel(?:\.exe|\.cmd)?"?(?:\s|$)', 0) IS NOT NULL) OR
    (regex_match(lower(cmdline), '(?:^|[\\/"])devtunnel(?:\.exe|\.cmd)?"?\s+host\b', 0) IS NOT NULL) OR (regex_match(lower(cmdline),
    '(?:^|[\\/"])tailscale(?:\.exe|\.cmd)?"?\s+funnel\s+(?!\s)(?!status|reset|--help|-h\b)(?![^|]*\soff\b)', 0) IS NOT NULL)
    OR (regex_match(lower(cmdline), '(?:^|[\\/"])ssh(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?-[a-z]*r\s*[0-9]', 0) IS NOT NULL) OR
    (regex_match(lower(cmdline), '(?:^|[\\/"])lt(?:\.js)?(?:\.exe|\.cmd)?"?\s+(?:--port|-p)\b', 0) IS NOT NULL) OR (regex_match(lower(cmdline),
    '(?:^|[\\/"])bore(?:\.exe|\.cmd)?"?\s+local\b', 0) IS NOT NULL)) ELSE 0 END) AS lcmd_tunnel, (CASE WHEN (lower(cmdline)
    LIKE '%rclone%' OR lower(cmdline) LIKE '%restic%' OR lower(cmdline) LIKE '%aws%' OR lower(cmdline) LIKE '%gsutil%' OR
    lower(cmdline) LIKE '%gcloud%' OR lower(cmdline) LIKE '%azcopy%' OR lower(cmdline) LIKE '%storage blob%' OR lower(cmdline)
    LIKE '%mega%' OR lower(cmdline) LIKE '%winscp%') THEN ((regex_match(lower(cmdline), '(?:^|[\\/"])rclone(?:\.exe|\.cmd)?"?\s+(?:copy|copyto|sync|move|moveto|bisync)\s+[^|]*?\s\"?([a-z0-9_-]{2,}):[^\s\"]*\"?(?:\s+--(?:config|log-file|[a-z]+-from|password-command)[\s=]\S+|\s+-\S+(?:\s+[^\s/\\:-][^\s:]*)?)*\s*$',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])restic(?:\.exe|\.cmd)?"?\s+(?:[^|]*\s)?backup\b', 0) IS NOT
    NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])aws(?:\.exe|\.cmd)?"?\s+s3\s+(?:cp|sync|mv)\s+(?:-\S+\s+)*(?!\"?s3://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?s3://',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])(?:gsutil|gcloud(?:\s+storage)?)(?:\.exe|\.cmd)?"?\s+(?:-\S+\s+)*(?:cp|rsync|mv)\s+(?:-\S+\s+)*(?!\"?gs://)\"?[^\s\"-][^\s\"]*\"?\s+(?:-\S+\s+)*\"?gs://',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])azcopy(?:\.exe|\.cmd)?"?\s+(?:copy|cp|sync)\s[^|]*\.blob\.core\.windows\.net',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])az(?:\.exe|\.cmd)?"?\s+storage\s+blob\s+(?:upload|upload-batch|sync)\b',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])(?:mega-put|mega-sync|megaput)\b|(?:^|[\\/"])megatools\s+(?:put|copy)\b',
    0) IS NOT NULL) OR (regex_match(lower(cmdline), '(?:^|[\\/"])winscp(?:\.com|\.exe)?\"?\s[^|]*\bput\b', 0) IS NOT NULL))
    ELSE 0 END) AS lcmd_sync, (CASE WHEN (lower(cmdline) LIKE '%7z%' OR lower(cmdline) LIKE '%rar%' OR lower(cmdline) LIKE
    '%zip%') THEN ((regex_match(lower(cmdline), '(?:^|[\\/"])7z[a-z]?(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-p', 0) IS NOT NULL)
    OR (regex_match(lower(cmdline), '(?:^|[\\/"])(?:win)?rar(?:\.exe|\.cmd)?"?\s+a\s+(?:[^|]*\s)?-(?:hp|p)', 0) IS NOT NULL)
    OR (regex_match(lower(cmdline), '(?:^|[\\/"])zip\s+(?:[^|]*\s)?(?:-e\b|-p\s|--encrypt|--password)', 0) IS NOT NULL)) ELSE
    0 END) AS lcmd_archive_pw FROM bpf_process_events WHERE syscall LIKE 'exec%' AND path != '') AS x;
  interval: 60
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: startup_items
  description: 'Things that run at boot or login: the usual persistence spots.'
  query: SELECT name, path, args, source, status, username FROM startup_items;
  interval: 3600
  platform: ''
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: launchd_run_at_load
  description: ''
  query: SELECT label, program, program_arguments, path FROM launchd WHERE run_at_load = '1';
  interval: 3600
  platform: darwin
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: authorized_keys
  description: 'SSH keys that may log in, one row per key (R23): the key''s type and its last 16 characters, never the key
    file''s path (it names the user); the same key added to a second account is not seen again.'
  query: SELECT k.algorithm, substr(k.key, -16) AS key_tail FROM users u CROSS JOIN authorized_keys k USING (uid);
  interval: 3600
  platform: darwin,linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: systemd_units
  description: 'systemd units outside the package directories (snap mounts excluded) and every user unit file, for R23: a
    new one is a new way to run at boot or login. The systemd_units table sees only the system manager (osqueryd runs as root),
    so user units come from the file table; type = ''regular'' follows symlinks, so enablement links under *.wants count too.'
  query: SELECT id AS name, fragment_path AS path FROM systemd_units WHERE fragment_path != '' AND fragment_path NOT LIKE
    '/usr/lib/%' AND fragment_path NOT LIKE '/lib/%' AND fragment_path NOT LIKE '/run/%' AND id NOT LIKE '%.mount' AND id
    NOT LIKE 'snap%' UNION ALL SELECT filename AS name, path FROM file WHERE path LIKE '/home/%/.config/systemd/user/%%' AND
    type = 'regular';
  interval: 3600
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: suid_bin
  description: 'Programs that run as their owner (usually root) whoever starts them (R23): a new one outside the package folders
    is a way back to root.'
  query: SELECT path, permissions FROM suid_bin;
  interval: 3600
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: kernel_modules
  description: 'Loaded kernel modules (R23): a new one is code running in the kernel.'
  query: SELECT name, status FROM kernel_modules;
  interval: 3600
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: ld_preload
  description: '/etc/ld.so.preload with content (R23): a library loaded into every program, the classic Linux userland rootkit.'
  query: SELECT path, size FROM file WHERE path = '/etc/ld.so.preload' AND size > 0;
  interval: 3600
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: risky_containers
  description: 'Running containers that are privileged or mount the Docker socket (R23): either one is root on the host.'
  query: SELECT c.name AS name, c.image AS image, c.privileged AS privileged, (SELECT count(*) FROM docker_container_mounts
    m WHERE m.id = c.id AND m.source LIKE '%docker.sock') AS sock FROM docker_containers c WHERE c.privileged = 1 OR sock
    > 0;
  interval: 600
  platform: linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: crontab
  description: ''
  query: SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;
  interval: 3600
  platform: darwin,linux
  logging: differential
  automations_enabled: true
  discard_data: true
  observer_can_run: false
---
apiVersion: v1
kind: report
spec:
  name: auto_start_services
  description: ''
