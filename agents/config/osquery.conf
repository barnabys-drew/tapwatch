{
  "options": {
    "host_identifier": "uuid",
    "schedule_splay_percent": 10,
    "utc": true
  },
  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 86400,
      "snapshot": true,
      "description": "What this machine is."
    },
    "os_version": {
      "query": "SELECT name, version, build, platform, arch FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    "host_addresses": {
      "query": "SELECT address FROM interface_addresses WHERE address NOT LIKE '127.%' AND address NOT LIKE '169.254.%' AND address != '::1' AND address NOT LIKE 'fe80:%';",
      "interval": 300,
      "snapshot": true,
      "description": "This machine's own addresses. DHCP moves a PC to a new IP; tapwatch follows these instead of trusting the IP in its config, so host context and the rules that name the PC keep working."
    },
    "listening_ports": {
      "query": "SELECT p.name, p.path, l.port, l.protocol, l.address FROM listening_ports l JOIN processes p USING (pid) WHERE l.address NOT IN ('127.0.0.1', '::1') AND l.port != 0;",
      "interval": 3600,
      "description": "Services reachable from the network. New rows mean something started listening."
    },
    "outbound_connections": {
      "query": "SELECT p.name, p.path, p.pid, p.on_disk, s.remote_address, s.remote_port, s.protocol, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS parent_name FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "description": "Which process holds which outside connection (Windows; a 1-minute snapshot, Sysmon has the full history), with its parent. Code signatures come from process_signatures: checked per socket here they took 15 s (measured 2026-10-17, 57 sockets), osquery's watchdog killed the worker and denylisted this query by name for 24 h, twice. Command lines are not logged here; the live check reads them and redacts them.",
      "platform": "windows"
    },
    "process_signatures": {
      "query": "SELECT path, result AS signature, subject_name AS signer FROM authenticode WHERE path IN (SELECT DISTINCT p.path FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0 AND p.path != '');",
      "interval": 300,
      "snapshot": true,
      "description": "The code signature (authenticode) of every program that currently holds an outside connection, once per distinct path (Windows; a 5-minute snapshot). tapwatch joins it to outbound_connections by path: the bad-signature rule (R21) and the host context's program judgement read it. Measured 2026-10-17: 5.8 s for 11 paths, against 15 s when checked per socket.",
      "platform": "windows"
    },
    "outbound_connections_ctx": {
      "query": "SELECT p.pid, p.name, p.path, p.on_disk, p.cgroup_path, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS parent_name, s.remote_address, s.remote_port, s.protocol, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ID') AS claude_session, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED') AS claude_attended, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT') AS claude_entrypoint, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "platform": "posix",
      "description": "Which process holds which outside connection, and whether a Claude Code session started it (attended or not, from an SSH login or the owner's Herdr terminal). Environment markers survive reparenting, unlike the parent chain. Reads only these named variables, never secrets. tapwatch's host context reads these rows. Also the parent program and whether the program's file was deleted after it started, and its cgroup (container processes look deleted from the host). Command lines are deliberately not logged here (they can carry tokens and this log is world-readable); tapwatch's live check reads them as the user and redacts them in memory."
    },
    "bpf_connections": {
      "query": "SELECT b.time, b.pid, b.parent, b.path, b.remote_address, b.remote_port, b.protocol, (SELECT name FROM processes pp WHERE pp.pid = b.parent) AS parent_name, (SELECT cgroup_path FROM processes p WHERE p.pid = b.pid) AS cgroup_path, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ID'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ID')) AS claude_session, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED')) AS claude_attended, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_ENTRYPOINT')) AS claude_entrypoint, (SELECT count(*) FROM process_envs e WHERE e.pid IN (b.pid, b.parent) AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM process_envs e WHERE e.pid IN (b.pid, b.parent) AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM bpf_socket_events b WHERE b.syscall = 'connect' AND b.family IN (2, 10) AND b.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1', '10.255.255.254') AND b.remote_port != 0;",
      "interval": 60,
      "platform": "linux",
      "description": "Linux (and WSL): every outgoing connection as it happens, from osquery's eBPF publisher (config/linux.flags), with the program, its parent and whether a Claude Code session, Herdr pane or SSH login started it (markers read from the process or its parent while they still run). The Linux counterpart of Sysmon's connection events: short HTTPS calls between the 1-minute snapshots no longer go unseen. Reads only the named environment variables. 10.255.255.254 is WSL's DNS proxy."
    },
    "bpf_process_events": {
      "query": "SELECT time, pid, parent, path, lcmd_dlrun, lcmd_revshell, lcmd_b64exec, lcmd_histclear, lcmd_tmpexec, lcmd_miner, CASE WHEN lcmd_dlrun OR lcmd_revshell OR lcmd_b64exec OR lcmd_histclear OR lcmd_tmpexec OR lcmd_miner THEN cmdline END AS cmdline FROM (SELECT time, pid, parent, path, cmdline, (regex_match(lower(cmdline), '(curl|wget)[^|;]*\\|\\s*(sudo(\\s+-\\S+)*\\s+)?(env\\s+)?(\\S*/)?(ba|z|da)?sh\\b|(ba|z|da)?sh\\s+(-c\\s+\\S?\\$\\(|<\\()\\s*(curl|wget)\\b', 0) IS NOT NULL) AS lcmd_dlrun, (regex_match(lower(cmdline), '/dev/(tcp|udp)/(?!(127\\.|localhost))|\\bnc(at)?(\\.openbsd|\\.traditional)?\\s+([^|;&]*\\s)?-[a-z]*e\\b|socat\\s[^|]*exec:|bash\\s+-i\\s*[>&]|mkfifo\\s[^|]*\\|\\s*[^|]*\\bnc\\b|python[0-9.]*\\s+-c\\s[^|]*socket[^|]*(subprocess|pty|dup2)|perl\\s+-e\\s[^|]*socket', 0) IS NOT NULL) AS lcmd_revshell, (regex_match(lower(cmdline), 'base64\\s+(-d|--decode)[^|]*\\|\\s*(sudo\\s+)?(ba|z|da)?sh\\b', 0) IS NOT NULL) AS lcmd_b64exec, (regex_match(lower(cmdline), 'unset\\s+histfile|history\\s+-c|histfile=/dev/null|ln\\s+-sf?\\s+/dev/null\\s+[^|]*bash_history|histsize=0\\b', 0) IS NOT NULL) AS lcmd_histclear, (regex_match(lower(cmdline), 'chmod\\s+(-[a-z]+\\s+)*([ugoa]*\\+[rwxst]*x|[0-7]*[1357][0-7]*)\\s+[^|;]*/(tmp|dev/shm|var/tmp)/', 0) IS NOT NULL) AS lcmd_tmpexec, (regex_match(lower(cmdline), 'stratum\\+(tcp|ssl|tls)://|^\\S*xmrig\\b|--donate-level|--coin[= ]+(monero|xmr)', 0) IS NOT NULL) AS lcmd_miner FROM bpf_process_events WHERE syscall LIKE 'exec%' AND path != '');",
      "interval": 60,
      "platform": "linux",
      "description": "Linux (and WSL): every program start as it happens (eBPF exec events): pid, parent pid and program, plus the R28 signals computed here from the command line: lcmd_dlrun (download piped into a shell), lcmd_revshell, lcmd_b64exec, lcmd_histclear, lcmd_tmpexec, lcmd_miner (a cryptominer). The command line itself is kept only when one fires; it can hold a token (curl -H 'Authorization: ...' | sh) and this log is readable by every local account, the same trade-off as the Windows Sysmon query. Not the working directory: home paths and project folder names would land in the same log."
    },
    "startup_items": {
      "query": "SELECT name, path, args, source, status, username FROM startup_items;",
      "interval": 3600,
      "description": "Things that run at boot or login: the usual persistence spots."
    },
    "launchd_run_at_load": {
      "query": "SELECT label, program, program_arguments, path FROM launchd WHERE run_at_load = '1';",
      "interval": 3600,
      "platform": "darwin"
    },
    "authorized_keys": {
      "query": "SELECT k.algorithm, substr(k.key, -16) AS key_tail FROM users u CROSS JOIN authorized_keys k USING (uid);",
      "interval": 3600,
      "platform": "posix",
      "description": "SSH keys that may log in, one row per key (R23): the key's type and its last 16 characters, never the key file's path (it names the user); the same key added to a second account is not seen again."
    },
    "systemd_units": {
      "query": "SELECT id AS name, fragment_path AS path FROM systemd_units WHERE fragment_path != '' AND fragment_path NOT LIKE '/usr/lib/%' AND fragment_path NOT LIKE '/lib/%' AND fragment_path NOT LIKE '/run/%' AND id NOT LIKE '%.mount' AND id NOT LIKE 'snap%' UNION ALL SELECT filename AS name, path FROM file WHERE path LIKE '/home/%/.config/systemd/user/%%' AND type = 'regular';",
      "interval": 3600,
      "platform": "linux",
      "description": "systemd units outside the package directories (snap mounts excluded) and every user unit file, for R23: a new one is a new way to run at boot or login. The systemd_units table sees only the system manager (osqueryd runs as root), so user units come from the file table; type = 'regular' follows symlinks, so enablement links under *.wants count too."
    },
    "suid_bin": {
      "query": "SELECT path, permissions FROM suid_bin;",
      "interval": 3600,
      "platform": "linux",
      "description": "Programs that run as their owner (usually root) whoever starts them (R23): a new one outside the package folders is a way back to root."
    },
    "kernel_modules": {
      "query": "SELECT name, status FROM kernel_modules;",
      "interval": 3600,
      "platform": "linux",
      "description": "Loaded kernel modules (R23): a new one is code running in the kernel."
    },
    "ld_preload": {
      "query": "SELECT path, size FROM file WHERE path = '/etc/ld.so.preload' AND size > 0;",
      "interval": 3600,
      "platform": "linux",
      "description": "/etc/ld.so.preload with content (R23): a library loaded into every program, the classic Linux userland rootkit."
    },
    "risky_containers": {
      "query": "SELECT c.name AS name, c.image AS image, c.privileged AS privileged, (SELECT count(*) FROM docker_container_mounts m WHERE m.id = c.id AND m.source LIKE '%docker.sock') AS sock FROM docker_containers c WHERE c.privileged = 1 OR sock > 0;",
      "interval": 600,
      "platform": "linux",
      "description": "Running containers that are privileged or mount the Docker socket (R23): either one is root on the host."
    },
    "crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 3600,
      "platform": "posix"
    },
    "auto_start_services": {
      "query": "SELECT name, display_name, path, module_path, user_account FROM services WHERE start_type = 'AUTO_START';",
      "interval": 3600,
      "platform": "windows"
    },
    "wmi_persistence": {
      "query": "SELECT 'cli' AS kind, name, executable_path AS action, command_line_template AS args FROM wmi_cli_event_consumers UNION ALL SELECT 'script' AS kind, name, scripting_engine AS action, script_file_name AS args FROM wmi_script_event_consumers;",
      "interval": 3600,
      "platform": "windows",
      "description": "WMI command-line and script event consumers: code that runs when a WMI event fires, a persistence place with no file in a startup folder (R23). Windows' own subscriptions use the built-in event-log consumer and do not appear here."
    },
    "scheduled_tasks": {
      "query": "SELECT name, action, path, enabled, last_run_time FROM scheduled_tasks WHERE enabled = 1;",
      "interval": 3600,
      "platform": "windows"
    },
    "chrome_extensions": {
      "query": "SELECT u.username, c.name, c.identifier, c.version, c.permissions, c.optional_permissions FROM users u CROSS JOIN chrome_extensions c USING (uid);",
      "interval": 86400
    },
    "logged_in_users": {
      "query": "SELECT user, type, host, time FROM logged_in_users;",
      "interval": 3600
    },
    "sysmon_events": {
      "query": "SELECT eventid, json_extract(data, '$.EventData.UtcTime') AS utc, json_extract(data, '$.EventData.ProcessGuid') AS guid, json_extract(data, '$.EventData.ParentProcessGuid') AS parent_guid, json_extract(data, '$.EventData.Image') AS path, CASE WHEN (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-e[a-z]*\\s+[a-z0-9+/=]{20,}', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression', 0) IS NOT NULL)  OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'vssadmin(\\.exe)?\\\"?[^|]*(delete[^|]*shadows|resize\\s+shadowstorage)|wbadmin(\\.exe)?\\\"?[^|]*delete[^|]*(catalog|systemstatebackup)|shadowcopy[^|]*delete|win32_shadowcopy', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'bcdedit(\\.exe)?\\\"?[^|]*(recoveryenabled\\s+no|bootstatuspolicy\\s+ignoreallfailures)', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'wevtutil(\\.exe)?\\\"?\\s+(cl|clear-log)\\s|clear-eventlog|limit-eventlog', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'set-mppreference[^|]*-disable|add-mppreference[^|]*-exclusion|mpcmdrun(\\.exe)?\\\"?[^|]*-removedefinitions|sc(\\.exe)?\\\"?\\s+(stop|config)\\s+windefend', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'net1?(\\.exe)?\\\"?\\s+user\\s[^|]*\\s/add|net1?(\\.exe)?\\\"?\\s+localgroup\\s+administrators\\s[^|]*\\s/add|add-localgroupmember|new-localuser', 0) IS NOT NULL) THEN json_extract(data, '$.EventData.CommandLine') END AS cmdline, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-e[a-z]*\\s+[a-z0-9+/=]{20,}', 0) IS NOT NULL) AS cmd_enc, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL) AS cmd_b64, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache', 0) IS NOT NULL) AS cmd_dl, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression', 0) IS NOT NULL) AS cmd_iex, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-w[a-z]*\\s+h[a-z]*', 0) IS NOT NULL) AS cmd_hidden, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-(ep|ex[a-z]*)\\s+bypass', 0) IS NOT NULL) AS cmd_bypass, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'https?://', 0) IS NOT NULL) AS cmd_url, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'vssadmin(\\.exe)?\\\"?[^|]*(delete[^|]*shadows|resize\\s+shadowstorage)|wbadmin(\\.exe)?\\\"?[^|]*delete[^|]*(catalog|systemstatebackup)|shadowcopy[^|]*delete|win32_shadowcopy', 0) IS NOT NULL) AS cmd_shadow, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'bcdedit(\\.exe)?\\\"?[^|]*(recoveryenabled\\s+no|bootstatuspolicy\\s+ignoreallfailures)', 0) IS NOT NULL) AS cmd_recovery, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'wevtutil(\\.exe)?\\\"?\\s+(cl|clear-log)\\s|clear-eventlog|limit-eventlog', 0) IS NOT NULL) AS cmd_logclear, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'set-mppreference[^|]*-disable|add-mppreference[^|]*-exclusion|mpcmdrun(\\.exe)?\\\"?[^|]*-removedefinitions|sc(\\.exe)?\\\"?\\s+(stop|config)\\s+windefend', 0) IS NOT NULL) AS cmd_defender, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'net1?(\\.exe)?\\\"?\\s+user\\s[^|]*\\s/add|net1?(\\.exe)?\\\"?\\s+localgroup\\s+administrators\\s[^|]*\\s/add|add-localgroupmember|new-localuser', 0) IS NOT NULL) AS cmd_admin, json_extract(data, '$.EventData.ParentImage') AS parent_path, json_extract(data, '$.EventData.DestinationIp') AS remote_address, json_extract(data, '$.EventData.DestinationPort') AS remote_port, json_extract(data, '$.EventData.QueryName') AS query, json_extract(data, '$.EventData.SourceImage') AS source_path, json_extract(data, '$.EventData.SourceProcessGUID') AS source_guid, json_extract(data, '$.EventData.TargetImage') AS target_path, json_extract(data, '$.EventData.GrantedAccess') AS granted FROM windows_events WHERE source = 'Microsoft-Windows-Sysmon/Operational' AND (eventid IN (1, 10, 22) OR (eventid = 3 AND json_extract(data, '$.EventData.Initiated') = 'true'));",
      "interval": 60,
      "platform": "windows",
      "description": "Sysmon, as it happens: process starts with parent (1), outgoing connections (3), DNS lookups (22), and other programs opening lsass.exe (10: source, target, access mask; sysmon.xml filters Windows' own), each with the program behind it. Command lines become yes/no signals here (cmd_enc encoded payload, cmd_b64, cmd_dl download-and-run, cmd_iex, cmd_hidden, cmd_bypass, cmd_url, and for R24 cmd_shadow backups removed, cmd_recovery, cmd_logclear, cmd_defender, cmd_admin); the raw text is logged only when one of enc/b64/dl/iex or an R24 signal fires (the same five patterns, kept in step by tests/test_hostrules.py), because osquery's log is readable by every local account. Needs the Windows event publisher flags (config/windows.flags)."
    }
  }
}
