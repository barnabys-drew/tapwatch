{
  "options": {
    "host_identifier": "uuid",
    "schedule_splay_percent": 10,
    "utc": true
  },
  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 86400,
      "snapshot": true,
      "description": "What this machine is."
    },
    "os_version": {
      "query": "SELECT name, version, build, platform, arch FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    "host_addresses": {
      "query": "SELECT address FROM interface_addresses WHERE address NOT LIKE '127.%' AND address NOT LIKE '169.254.%' AND address != '::1' AND address NOT LIKE 'fe80:%';",
      "interval": 300,
      "snapshot": true,
      "description": "This machine's own addresses. DHCP moves a PC to a new IP; tapwatch follows these instead of trusting the IP in its config, so host context and the rules that name the PC keep working."
    },
    "listening_ports": {
      "query": "SELECT p.name, p.path, l.port, l.protocol, l.address FROM listening_ports l JOIN processes p USING (pid) WHERE l.address NOT IN ('127.0.0.1', '::1') AND l.port != 0;",
      "interval": 3600,
      "description": "Services reachable from the network. New rows mean something started listening."
    },
    "outbound_connections": {
      "query": "SELECT p.name, p.path, p.pid, p.on_disk, s.remote_address, s.remote_port, s.protocol, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS parent_name, (SELECT result FROM authenticode a WHERE a.path = p.path) AS signature, (SELECT subject_name FROM authenticode a WHERE a.path = p.path) AS signer FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "description": "Which process holds which outside connection (Windows; a 1-minute snapshot, Sysmon has the full history), with its parent and code signature (authenticode), which tapwatch's host context uses to judge it. Command lines are not logged here; the live check reads them and redacts them.",
      "platform": "windows"
    },
    "outbound_connections_ctx": {
      "query": "SELECT p.pid, p.name, p.path, p.on_disk, p.cgroup_path, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS parent_name, s.remote_address, s.remote_port, s.protocol, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ID') AS claude_session, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED') AS claude_attended, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT') AS claude_entrypoint, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "platform": "posix",
      "description": "Which process holds which outside connection, and whether a Claude Code session started it (attended or not, from an SSH login or the owner's Herdr terminal). Environment markers survive reparenting, unlike the parent chain. Reads only these named variables, never secrets. tapwatch's host context reads these rows. Also the parent program and whether the program's file was deleted after it started, and its cgroup (container processes look deleted from the host). Command lines are deliberately not logged here (they can carry tokens and this log is world-readable); tapwatch's live check reads them as the user and redacts them in memory."
    },
    "bpf_connections": {
      "query": "SELECT b.time, b.pid, b.path, b.remote_address, b.remote_port, b.protocol, (SELECT name FROM processes pp WHERE pp.pid = b.parent) AS parent_name, (SELECT cgroup_path FROM processes p WHERE p.pid = b.pid) AS cgroup_path, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ID'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ID')) AS claude_session, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED')) AS claude_attended, COALESCE((SELECT value FROM process_envs e WHERE e.pid = b.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT'), (SELECT value FROM process_envs e WHERE e.pid = b.parent AND e.key = 'CLAUDE_CODE_ENTRYPOINT')) AS claude_entrypoint, (SELECT count(*) FROM process_envs e WHERE e.pid IN (b.pid, b.parent) AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM process_envs e WHERE e.pid IN (b.pid, b.parent) AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM bpf_socket_events b WHERE b.syscall = 'connect' AND b.family IN (2, 10) AND b.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1', '10.255.255.254') AND b.remote_port != 0;",
      "interval": 60,
      "platform": "linux",
      "description": "Linux (and WSL): every outgoing connection as it happens, from osquery's eBPF publisher (config/linux.flags), with the program, its parent and whether a Claude Code session, Herdr pane or SSH login started it (markers read from the process or its parent while they still run). The Linux counterpart of Sysmon's connection events: short HTTPS calls between the 1-minute snapshots no longer go unseen. Reads only the named environment variables. 10.255.255.254 is WSL's DNS proxy."
    },
    "startup_items": {
      "query": "SELECT name, path, args, source, status, username FROM startup_items;",
      "interval": 3600,
      "description": "Things that run at boot or login: the usual persistence spots."
    },
    "launchd_run_at_load": {
      "query": "SELECT label, program, program_arguments, path FROM launchd WHERE run_at_load = '1';",
      "interval": 3600,
      "platform": "darwin"
    },
    "crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 3600,
      "platform": "posix"
    },
    "auto_start_services": {
      "query": "SELECT name, display_name, path, module_path, user_account FROM services WHERE start_type = 'AUTO_START';",
      "interval": 3600,
      "platform": "windows"
    },
    "scheduled_tasks": {
      "query": "SELECT name, action, path, enabled, last_run_time FROM scheduled_tasks WHERE enabled = 1;",
      "interval": 3600,
      "platform": "windows"
    },
    "chrome_extensions": {
      "query": "SELECT u.username, c.name, c.identifier, c.version, c.permissions FROM users u CROSS JOIN chrome_extensions c USING (uid);",
      "interval": 86400
    },
    "logged_in_users": {
      "query": "SELECT user, type, host, time FROM logged_in_users;",
      "interval": 3600
    },
    "sysmon_events": {
      "query": "SELECT eventid, json_extract(data, '$.EventData.UtcTime') AS utc, json_extract(data, '$.EventData.ProcessGuid') AS guid, json_extract(data, '$.EventData.Image') AS path, CASE WHEN (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-e[a-z]*\\s+[a-z0-9+/=]{20,}', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache', 0) IS NOT NULL) OR (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression', 0) IS NOT NULL) THEN json_extract(data, '$.EventData.CommandLine') END AS cmdline, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-e[a-z]*\\s+[a-z0-9+/=]{20,}', 0) IS NOT NULL) AS cmd_enc, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'frombase64string', 0) IS NOT NULL) AS cmd_b64, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'downloadstring|downloadfile|start-bitstransfer|bitsadmin[^|]*/transfer|certutil[^|]*urlcache', 0) IS NOT NULL) AS cmd_dl, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '(^|[^a-z])iex([^a-z]|$)|invoke-expression', 0) IS NOT NULL) AS cmd_iex, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-w[a-z]*\\s+h[a-z]*', 0) IS NOT NULL) AS cmd_hidden, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), '\\s-(ep|ex[a-z]*)\\s+bypass', 0) IS NOT NULL) AS cmd_bypass, (regex_match(lower(json_extract(data, '$.EventData.CommandLine')), 'https?://', 0) IS NOT NULL) AS cmd_url, json_extract(data, '$.EventData.ParentImage') AS parent_path, json_extract(data, '$.EventData.DestinationIp') AS remote_address, json_extract(data, '$.EventData.DestinationPort') AS remote_port, json_extract(data, '$.EventData.QueryName') AS query FROM windows_events WHERE source = 'Microsoft-Windows-Sysmon/Operational' AND (eventid IN (1, 22) OR (eventid = 3 AND json_extract(data, '$.EventData.Initiated') = 'true'));",
      "interval": 60,
      "platform": "windows",
      "description": "Sysmon, as it happens: process starts with parent (1), outgoing connections (3) and DNS lookups (22), each with the program behind it. Command lines become yes/no signals here (cmd_enc encoded payload, cmd_b64, cmd_dl download-and-run, cmd_iex, cmd_hidden, cmd_bypass, cmd_url); the raw text is logged only when one of enc/b64/dl/iex fires, because osquery's log is readable by every local account. Needs the Windows event publisher flags (config/windows.flags)."
    }
  }
}
