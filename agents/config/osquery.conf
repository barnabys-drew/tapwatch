{
  "options": {
    "host_identifier": "uuid",
    "schedule_splay_percent": 10,
    "utc": true
  },
  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 86400,
      "snapshot": true,
      "description": "What this machine is."
    },
    "os_version": {
      "query": "SELECT name, version, build, platform, arch FROM os_version;",
      "interval": 86400,
      "snapshot": true
    },
    "listening_ports": {
      "query": "SELECT p.name, p.path, l.port, l.protocol, l.address FROM listening_ports l JOIN processes p USING (pid) WHERE l.address NOT IN ('127.0.0.1', '::1') AND l.port != 0;",
      "interval": 3600,
      "description": "Services reachable from the network. New rows mean something started listening."
    },
    "outbound_connections": {
      "query": "SELECT p.name, p.path, p.pid, s.remote_address, s.remote_port, s.protocol FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "description": "Which process holds which outside connection (Windows; a 1-minute snapshot, Sysmon has the full history).",
      "platform": "windows"
    },
    "outbound_connections_ctx": {
      "query": "SELECT p.pid, p.name, p.path, p.on_disk, (SELECT name FROM processes pp WHERE pp.pid = p.parent) AS parent_name, s.remote_address, s.remote_port, s.protocol, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ID') AS claude_session, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_SESSION_ATTENDED') AS claude_attended, (SELECT value FROM process_envs e WHERE e.pid = p.pid AND e.key = 'CLAUDE_CODE_ENTRYPOINT') AS claude_entrypoint, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key = 'HERDR_PANE_ID') AS in_herdr, (SELECT count(*) FROM process_envs e WHERE e.pid = p.pid AND e.key IN ('SSH_CONNECTION', 'SSH_CLIENT')) AS via_ssh FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '::', '127.0.0.1', '::1') AND s.remote_port != 0;",
      "interval": 60,
      "platform": "posix",
      "description": "Which process holds which outside connection, and whether a Claude Code session started it (attended or not, from an SSH login or the owner's Herdr terminal). Environment markers survive reparenting, unlike the parent chain. Reads only these named variables, never secrets. tapwatch's host context reads these rows. Also the parent program and whether the program's file was deleted after it started. Command lines are deliberately not logged here (they can carry tokens and this log is world-readable); tapwatch's live check reads them as the user and redacts them in memory."
    },
    "startup_items": {
      "query": "SELECT name, path, args, source, status, username FROM startup_items;",
      "interval": 3600,
      "description": "Things that run at boot or login: the usual persistence spots."
    },
    "launchd_run_at_load": {
      "query": "SELECT label, program, program_arguments, path FROM launchd WHERE run_at_load = '1';",
      "interval": 3600,
      "platform": "darwin"
    },
    "crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 3600,
      "platform": "posix"
    },
    "auto_start_services": {
      "query": "SELECT name, display_name, path, module_path, user_account FROM services WHERE start_type = 'AUTO_START';",
      "interval": 3600,
      "platform": "windows"
    },
    "scheduled_tasks": {
      "query": "SELECT name, action, path, enabled, last_run_time FROM scheduled_tasks WHERE enabled = 1;",
      "interval": 3600,
      "platform": "windows"
    },
    "chrome_extensions": {
      "query": "SELECT u.username, c.name, c.identifier, c.version, c.permissions FROM users u CROSS JOIN chrome_extensions c USING (uid);",
      "interval": 86400
    },
    "logged_in_users": {
      "query": "SELECT user, type, host, time FROM logged_in_users;",
      "interval": 3600
    }
  }
}
