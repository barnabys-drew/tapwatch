name: SAST

# Static analysis. Runs on main (every merge and push) and weekly, so rule
# updates catch old code. Findings fail the run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install semgrep (pinned)
        run: python -m pip install --disable-pip-version-check semgrep==1.180.0

      - name: Semgrep scan
        run: >
          semgrep scan --error --metrics=off --quiet
          --config p/security-audit
          --config p/secrets
          --config p/python --config p/dockerfile 
          --exclude node_modules --exclude vendor --exclude .venv
