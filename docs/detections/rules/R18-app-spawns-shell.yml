title: Document, mail or PDF app starts a shell or script host
id: 9a4d2e1b-3c7f-4b65-8e0a-5d1f6c2b7a93
status: experimental
description: |
  R18. The macro and attachment path: Word, Excel, Outlook or a PDF reader starting PowerShell, cmd,
  wscript, cscript, mshta, rundll32 or regsvr32. Measured 2026-10-14/15 on a dev PC: 0 (no Office installed).
  tapwatch (hostrules.AppSpawnsShell): severity 4, ALERT, code-only, suppressible by the "parent > child"
  pair. Not must_alert, because Office automation exists. Jev: none.
references:
  - docs/detections/DESIGN.md
  - https://attack.mitre.org/techniques/T1204/002/
logsource:
  product: windows
  category: process_creation
detection:
  child:
    Image|endswith: ['\powershell.exe', '\pwsh.exe', '\cmd.exe', '\wscript.exe', '\cscript.exe', '\mshta.exe',
                     '\rundll32.exe', '\regsvr32.exe', '\bitsadmin.exe', '\certutil.exe']
  doc_parent:
    ParentImage|endswith: ['\WINWORD.EXE', '\EXCEL.EXE', '\POWERPNT.EXE', '\OUTLOOK.EXE', '\ONENOTE.EXE',
                           '\MSACCESS.EXE', '\MSPUB.EXE', '\AcroRd32.exe', '\Acrobat.exe', '\FoxitPDFReader.exe',
                           '\HxOutlook.exe', '\olk.exe']
  condition: child and doc_parent
fields: [Image, ParentImage, User]
falsepositives:
  - Office add-ins and PDF readers' updaters that run scripts (alert once, then suppress the parent > child pair)
level: high
tags: [attack.execution, attack.t1204.002, attack.initial_access, attack.t1566.001]
