[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapwatch"
version = "0.1.1"
description = "Network security monitoring for a home or small office: Zeek, plain-code detectors, optional AI triage."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["zeek", "network-security", "ids", "home-network", "threat-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/barnabys-drew/tapwatch"
Documentation = "https://github.com/barnabys-drew/tapwatch/tree/main/docs"
Issues = "https://github.com/barnabys-drew/tapwatch/issues"

[project.scripts]
tapwatch = "tapwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
