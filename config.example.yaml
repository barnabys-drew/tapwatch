# Copy to config.yaml. Secrets are read from the environment variables named here.
db_path: /data/tapwatch.db
assets_file: /config/assets.yaml
ioc_file: /config/iocs.txt          # optional: one IP or domain per line (always alerts)
feeds_dir: /config/feeds             # `tapwatch update-feeds` downloads the public lists here (weekly is plenty)
# The lists below default to feeds_dir; set them only to use your own copies:
# popular_domains_file: top-100k.csv  # Tranco popular domains (rank,domain)
# oui_file: oui.csv                   # IEEE MAC vendor registry (new-device vendor names)
# asn_file: ip2asn-v4.tsv.gz          # iptoasn.com IP -> network and country (IoT drift)
# categories_file: categories.tsv     # UT1 site categories
# public_suffix_file: public_suffix_list.dat   # Public Suffix List, ICANN rules (registrable domains)
# adfection_iocs_file: iocs-adfection.tsv      # AdFection / Candiru spyware indicators, read with ioc_file

typesafe:
  enabled: true                      # false = rules only, nothing leaves the network
  provider: auto                     # auto | typesafe | vercel  (auto: TypeSafe key if set, else Vercel)
  api_key_env: TYPESAFE_API_KEY      # direct from console.typesafe.ai
  model: jev-1.13.0                  # pinned on purpose; re-run the eval before changing
  gateway_key_env: AI_GATEWAY_API_KEY   # or via Vercel AI Gateway (billed by Vercel)
  gateway_model: typesafe-ai/jev

# Site categories for new_domain, tls_odd and upload_spike come from the offline UT1 lists (update-feeds).
# Opt in here to ask a small Claude model about domains the lists do not name (security vendors,
# conferencing, CDNs, SaaS, developer tools: where a first day's false alarms came from). One closed
# question per registrable domain ("which of these labels"), cached for 30 days in
# feeds_dir/categories.learned.tsv; the answer is a fact in the case, never routing. What is sent to
# Anthropic: the registrable domain only (example.com, never the host, the device, or local names).
# Cost: a few hundred tokens per new domain, at most per_hour questions an hour.
categories:
  ai: false                          # true + ANTHROPIC_API_KEY in .env to turn it on
  model: claude-haiku-5-5
  per_hour: 60
  api_key_env: ANTHROPIC_API_KEY

# Where alerts go. Set any of these environment variables (in .env); every one that's set gets the
# alert, and email (below) is the fallback when they all fail. URLs are secrets, so never put them here.
#   TAPWATCH_NTFY_URL      phone push via ntfy: https://ntfy.sh/<a long random topic> (+ TAPWATCH_NTFY_TOKEN if protected)
#   TAPWATCH_DISCORD_URL   a Discord channel webhook (Channel settings > Integrations > Webhooks)
#   TAPWATCH_TEAMS_URL     Teams > channel > Workflows > "Post to a channel when a webhook request is received"
#   TAPWATCH_WEBHOOK_URL   any JSON webhook (Home Assistant, n8n, Slack workflow...)
# To read a different variable name: ntfy: {url_env: ..., token_env: ...}, discord: {webhook_url_env: ...},
# teams: {webhook_url_env: ...}, webhook: {url_env: ...}

# smtp:                              # optional email fallback (or copy, with always: true)
#   host: smtp.office365.com
#   port: 587
#   username: alerts@yourcompany.example
#   password_env: TAPWATCH_SMTP_PASSWORD
#   from: alerts@yourcompany.example
#   to: it@yourcompany.example
#   always: false

ui:                                  # `tapwatch ui` (case queue in the browser)
  base_url: http://127.0.0.1:8765    # alert and digest emails link to <base_url>/case/<id>
  port: 8765
  zeek_dirs: [/logs]                 # where case pages read evidence from; globs like eval/data/home-mirror-* work
  # host: 0.0.0.0                    # LAN access: also set TAPWATCH_UI_TOKEN (16+ chars) in .env
  token_env: TAPWATCH_UI_TOKEN
  # Or reach it over Tailscale with no token: keep host 127.0.0.1, run
  # `tailscale serve --bg --https=10000 http://127.0.0.1:8765`, set base_url to
  # https://<machine>.<tailnet>.ts.net:10000 and list who may use it:
  # tailscale_users: [you@example.com]

herdr:                               # pop critical cases up in the Herdr terminal workspace
  enabled: false                     # `tapwatch test-alert --herdr` to try it
  ai_severity: 3.5                   # AI-routed alerts must be rated at least this (0-4) to pop up
  sound: request                     # none | done | request
  position: top-right

host_context:                        # "who on this PC did it?" for cases on the tapwatch PC itself
  host: ""                           # this PC's IP as Zeek sees it; empty = off. If DHCP moves the PC, tapwatch
                                     # follows the addresses its agent reports (and warns): still, fix the IP in the router
  # hostname: my-pc                  # this PC's DHCP hostname; default: this machine's own name; empty = name check
                                     # off. A case whose DHCP name differs (another device on a shared dock's address)
                                     # gets no host context; set this when the warning says the PC's own name differs
  # osquery_bin: /opt/osquery/bin/osqueryd   # default: osqueryi/osqueryd on PATH (live check)
  # results_logs: [/var/log/osquery/osqueryd.results.log, "/mnt/c/Program Files/osquery/log/osqueryd.results.log"]
  #                                  # the endpoint rules (R17-R21, hostrules.py) follow these logs' directories too
  # transcripts: ~/.claude/projects  # Claude Code session logs, read locally, never sent anywhere

syslog:                              # `tapwatch syslog`: the router's CEF events (IPS, admin logins)
  listen: 0.0.0.0:5514               # UniFi 10.x: CyberSecure > Traffic Logging > Activity Logging > SIEM Server
                                     # (docs/setup/router-syslog.md: untick "Firewall Default Policy", it floods)
  out: /logs                         # same dir `run` watches
  allow: []                          # senders to accept; default network.gateways (UDP can be spoofed)
timezone: America/Chicago            # for time-of-day rules (night joins, off-hours, business hours); default: local
audience: office                     # office | home: how summaries and Jev's questions frame events.
                                     # Keep "office", even at home: "home" cost Jev both of its C2 alerts
                                     # in eval/RESULTS.md ("Wording")
zeek_retention_days: 30              # rotated Zeek logs older than this are deleted (0 = keep forever)
summaries:                           # per-device daily summaries for the 30-day rules (`tapwatch summarize`)
  enabled: true                      # `run` summarizes each finished day in the background, once a night
  hour: 4                            # local hour it starts (a day's last connections are logged after midnight)
  retention_days: 90                 # summaries older than this are deleted (0 = keep forever)
  rules: true                        # then the long-horizon rules (R30 slow_beacon, R31 slow_upload) read them
  mature_days: 14                    # watched days a device needs before those rules may fire
digest_hour_utc: 13
dedupe_seconds: 3600
warmup_seconds: 86400                # first-seen rules stay quiet for the first day
learning_days: 3                     # AI alerts go to the digest this long after the first packet (always-alert
                                     # rules and agent misuse still interrupt); 0 = off. Survives restarts.

thresholds:
  min_confidence: 0.6
  page_prob: 0.7
  page_severity: 2.5
  routine_prob: 0.8
  alert_confidence: 0.75             # Jev's category confidence needed to alert on its own (see eval/RESULTS.md)

network:                             # home rules (docs/detections/DESIGN.md R03, R14)
  gateways: []                       # optional: router addresses, one per VLAN if you want that VLAN strict
                                     # (any other DHCP server there is rogue). Each /24 not listed is learned
                                     # from the logs: the address 3+ devices use for DNS/NAT-PMP/DHCP
  admin_devices: []                  # devices allowed to use admin ports (SSH, RDP, router UI): an address,
                                     # or name:<DHCP hostname> / mac:<address> for phones with the UniFi app.
                                     # name: trusts any device announcing that hostname; mac: is stricter
  local_nets: []                     # your LAN's public IPv6 prefix(es), e.g. [2001:db8:1234::/48]. Private IPv4
                                     # and link-local/ULA IPv6 are built in; without this, devices' IPv6 global
                                     # traffic (phones prefer it) is invisible to every detector
  public_ips: []                     # the house's own public IPv4 address(es), one address each (no names or
                                     # ranges): devices reaching each other through it (Tailscale, a port forward
                                     # used from inside) aren't talking to the internet, so that traffic is skipped.
                                     # Update it if your ISP changes the address: a stale one hides traffic to
                                     # whoever has it now. Behind CGNAT (a 100.64.x.x WAN address), leave it empty

# update:                            # `tapwatch update` (#304): releases follows the newest vX.Y.Z tag, main follows
#   channel: releases                # the main branch (a dev install). The daily digest says when a newer release
#   notify: true                     # exists; nothing updates by itself.

# account_check:                     # opt-in: ask your own Google accounts what an upload_spike to Google was
#   google: [personal]               # account labels, never addresses; or {label: work, services: [drive]}
#   token_dir: ~/.local/state/tapwatch/accounts   # refresh tokens (mode 600), outside the repo
# Sign in with `tapwatch accounts add personal`, check with `tapwatch account-check <case> --save`.
# The OAuth client goes in .env: TAPWATCH_GOOGLE_CLIENT_ID / TAPWATCH_GOOGLE_CLIENT_SECRET. docs/setup/account-check.md

dev_profile:                         # dev workstations running coding agents
  hosts: []                          # their traffic to dev services (model APIs, registries, GitHub) is not
  domains: []                        # flagged by beaconing/dns_anomaly/new_domain; takeover still applies

detectors:
  beaconing: {min_count: 10, min_span: 600, max_cv: 0.15, jitter: true}   # also: reported_days 7 (one case per
                                                             # destination this often), fanout_per_day 3 (per device
                                                             # and port); jitter: catch random sleep jitter too (R04)
  #   benign_classes:                  # services that are regular by design: a heartbeat to them is capped at
  #     endpoint security agent: [edr.example.com]   # digest (R04). Adds to the built-in push/EDR/NTP/STUN table.
  dns_anomaly: {window: 600, nx_threshold: 25, random_threshold: 15}   # also: nx_min_names 5, tunnel_queries 200, tunnel_label_len 30
  scan: {window: 60, threshold: 50}
  upload_spike: {multiple: 10, floor_bytes: 500000000}
  new_domain: {window: 300}          # new domains per device are grouped into one case per window; a window of
                                     # only popular, readable names opens none (report_popular: true to keep them)
  exposure: {stun_window: 600, reply_window: 1800, startup: 120}   # R01; declared port forwards count as known:
  #   expected: [{host: 192.168.1.10, proto: tcp, port: 32400}]       #   config, not a suppression (still must_alert)
  odd_port: {learn_days: 7, long_hours: 4}   # R06: learn the house's ports this long, then flag new ones; also
                                             # reported_days 7 (a device+port is reported again after this long)
  #   tls_odd: {threshold: 3, reported_days: 7}  # R10: same expiry; pairs learned in warmup are kept for good
  #   host_rules: {enabled: true}      # R17-R21, from the endpoint agent's log; per rule: host_temp_exec: {reported_days: 7}
  takeover:                          # R16. Callback and file-drop services can't be marked expected
    timezone: America/Chicago        # for `hours`; default is this machine's local time
    session_bytes: 2000000           # outside hours, this much in 10 min to the tool = a live session
    expected: []
    # - host: 192.168.1.30           # a work laptop with a remote-support app
    #   services: [teamviewer.com]
    #   hours: Mon-Fri 08:00-18:00
    #   mac: "aa:bb:cc:dd:ee:ff"     # optional: stop applying if a lease gives this IP to another device
